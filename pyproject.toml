[project]
name = "kmer-orbit-fieldshift"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "earthaccess>=0.19.0",
    "fastapi>=0.162.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
    "xarray>=2026.9.0",
]

[tool.pyrefly]
search-path = ["scripts", "backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
